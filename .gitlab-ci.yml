stages:
  - test

test_api:
  image: mariadb
  services:
    - mariadb
  variables: 
    DB_HOST: mariadb
    MYSQL_ROOT_PASSWORD: example
    MYSQL_DATABASE: test_flower
    MYSQL_USER: django
    MYSQL_PASSWORD: coucou
  stage: test
  before_script: 
    - apt-get update && apt-get install python3.8 python3-pip libmysqlclient-dev locales -y
    - cd ./flower_backend
    - pip3 install -r requirements.txt
    - localedef -i fr_FR -c -f UTF-8 -A /usr/share/locale/locale.alias fr_FR.UTF-8
  script:
    - python3 manage.py test --noinput